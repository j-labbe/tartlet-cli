name: Stage npm release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish staged packages after owner approval
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run pack:smoke
      - run: mkdir artifacts
      - run: npm pack --workspace @tartlet/protocol --workspace @tartlet/cli --pack-destination artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-packages
          path: artifacts/*.tgz
          if-no-files-found: error
  publish:
    if: inputs.publish
    needs: stage
    environment: npm-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-packages
          path: artifacts
      - run: npm publish artifacts/tartlet-protocol-*.tgz --access public --provenance
      - run: npm publish artifacts/tartlet-cli-*.tgz --access public --provenance
